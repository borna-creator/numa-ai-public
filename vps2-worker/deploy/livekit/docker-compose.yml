# Self-hosted LiveKit on VPS 2.
# Host networking avoids docker-proxy UDP port mapping failures on many VPS providers.
# Copy livekit.yaml.example → livekit.yaml and add keys from:
#   docker run --rm livekit/livekit-server generate-keys

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - livekit_redis:/data

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      - redis

volumes:
  livekit_redis:
